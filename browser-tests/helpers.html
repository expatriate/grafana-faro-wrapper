<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      .bg {
        width: 20px;
        height: 20px;
      }
      .bg-from-class {
        background-image: url(/img/ok.png);
      }
      .pseudo::before {
        content: '';
        background-image: url(/img/ok.png);
      }
    </style>
  </head>
  <body>
    <div id="cases"></div>
    <script src="/bundle.js"></script>
    <script>
      const H = GrafanaFaroWrapper;
      const PNG_DATA =
        'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';

      const RETINA = devicePixelRatio >= 2;
      const OTHER_ORIGIN = location.origin.replace('127.0.0.1', 'localhost');
      customElements.define(
        'shadow-logo',
        class extends HTMLElement {
          connectedCallback() {
            this.attachShadow({ mode: 'open' }).innerHTML = '<img src="/img/ok.png?shadow">';
          }
        },
      );

      const imageCases = [
        ['img-html-200', '<img src="/img/html-page.png">', false, false],
        [
          'img-html-200-svg',
          '<img src="/img/html-page.svg">',
          true,
          false,
          'README: синхронная не отличает битый SVG',
        ],
        [
          'img-wrong-mime-svg',
          '<img src="/img/wrong-mime.svg">',
          true,
          false,
          'README: синхронная не отличает битый SVG',
        ],
        ['img-percent-svg', '<img src="/img/percent.svg">', true, true],
        ['img-zero-size-svg', '<img src="/img/zero.svg">', true, true],
        ['img-cross-origin', `<img src="${OTHER_ORIGIN}/img/ok.png?xo">`, true, true],
        [
          'img-crossorigin-without-cors',
          `<img crossorigin="anonymous" src="${OTHER_ORIGIN}/img/ok.png?cors">`,
          false,
          false,
        ],
        [
          'img-srcset-density',
          '<img srcset="/img/missing.png?dpr 1x, /img/ok.png?dpr 2x">',
          RETINA,
          RETINA,
        ],
        [
          'img-in-shadow-dom',
          '<shadow-logo></shadow-logo>',
          false,
          false,
          'README: Shadow DOM не проверяется',
        ],
        [
          'img-inline-svg-only',
          '<svg width="10" height="10"><rect width="10" height="10"/></svg>',
          false,
          false,
          'README: обёртка без <img>',
        ],
        ['img-swap-to-broken', '<img src="/img/ok.png?swapbroken">', false, false],
        [
          'img-swap-to-slow',
          '<img src="/img/ok.png?swapslow">',
          false,
          true,
          'синхронная — сразу после смены src',
        ],
        ['img-ok', '<img src="/img/ok.png">', true, true],
        ['img-404', '<img src="/img/missing.png">', false, false],
        ['img-corrupt', '<img src="/img/corrupt.png">', false, false],
        ['img-slow', '<img src="/img/slow.png">', true, true],
        ['img-svg-viewbox', '<img src="/img/viewbox.svg">', true, true],
        ['img-svg-sized', '<img src="/img/sized.svg">', true, true],
        ['img-svg-bare', '<img src="/img/bare.svg">', true, true],
        [
          'img-svg-404',
          '<img src="/img/missing.svg">',
          true,
          false,
          'README: синхронная не отличает битый SVG',
        ],
        [
          'img-svg-corrupt',
          '<img src="/img/corrupt.svg">',
          true,
          false,
          'README: синхронная не отличает битый SVG',
        ],
        ['img-svg-without-extension', '<img src="/img/svg-without-extension">', true, true],
        ['img-png-named-svg', '<img src="/img/png-named.svg">', true, true],
        ['img-srcset-only', '<img srcset="/img/ok.png 1x">', true, true],
        [
          'img-picture-source',
          '<picture><source srcset="/img/ok2.png"><img src="/img/missing.png"></picture>',
          true,
          true,
        ],
        ['img-display-none', '<img src="/img/ok.png?hidden" style="display:none">', true, true],
        [
          'img-lazy-offscreen',
          '<div style="margin-top:4000px"><img loading="lazy" src="/img/ok2.png?lazy"></div>',
          false,
          false,
          'не загружена браузером — «загружено» = false',
        ],
        ['img-no-src', '<img>', false, false],
        ['img-data-uri', `<img src="${PNG_DATA}">`, true, true],
        ['img-wrapper-ok', '<div><img src="/img/ok.png?wrapped"></div>', true, true],
        ['img-wrapper-empty', '<div></div>', false, false],
        [
          'img-one-of-two-broken',
          '<img src="/img/ok.png?pair"><img src="/img/missing.png?pair">',
          false,
          false,
        ],
      ];

      const backgroundCases = [
        [
          'bg-data-svg-single-quotes',
          `background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10'><rect fill='url(%23g)' width='10' height='10'/></svg>")`,
          true,
        ],
        [
          'bg-data-svg-double-quotes',
          `background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><rect width="10" height="10"/></svg>')`,
          true,
        ],
        [
          'bg-image-set-density',
          'background-image:image-set(url(/img/missing.png?set) 1x, url(/img/ok.png?set) 2x)',
          RETINA,
        ],
        ['bg-shorthand', 'background:#fff url(/img/ok.png?short) no-repeat', true],
        ['bg-html-200', 'background-image:url(/img/html-page.png?bg)', false],
        ['bg-custom-property', '--logo:url(/img/ok.png?var);background-image:var(--logo)', true],
        ['bg-ok', 'background-image:url(/img/ok.png)', true],
        ['bg-404', 'background-image:url(/img/missing.png)', false],
        ['bg-corrupt', 'background-image:url(/img/corrupt.png)', false],
        ['bg-slow', 'background-image:url(/img/slow.png?bg)', true],
        [
          'bg-gradient-only',
          'background-image:linear-gradient(red, blue)',
          false,
          'README: градиент без url() — false',
        ],
        [
          'bg-gradient-then-url',
          'background-image:linear-gradient(red, blue), url(/img/ok.png)',
          true,
        ],
        [
          'bg-first-url-broken',
          'background-image:url(/img/missing.png), url(/img/ok.png)',
          false,
          'README: берётся первый url()',
        ],
        ['bg-image-set-url', 'background-image:image-set(url(/img/ok.png) 1x)', true],
        ['bg-image-set-string', 'background-image:image-set("/img/ok.png" 1x)', true],
        ['bg-svg-bare', 'background-image:url(/img/bare.svg)', true],
        ['bg-svg-404', 'background-image:url(/img/missing.svg)', false],
        ['bg-svg-without-extension', 'background-image:url(/img/svg-without-extension)', true],
        ['bg-parens-in-url', 'background-image:url("/img/ok.png?a=(1)")', true],
        ['bg-quote-in-url', `background-image:url("/img/ok.png?q='x'")`, true],
        ['bg-display-none', 'display:none;background-image:url(/img/ok.png?bghidden)', true],
        ['bg-none', '', false],
      ];

      const cases = [];
      const add = (id, html) => {
        const box = document.createElement('div');
        box.id = id;
        box.innerHTML = html;
        document.getElementById('cases').append(box);
      };
      imageCases.forEach(([id, html]) => add(id, html));
      backgroundCases.forEach(([id, style]) => {
        add(id, '<div class="bg"></div>');
        document.querySelector(`#${id} > div`).style.cssText += style;
      });
      add('bg-from-class', '<div class="bg bg-from-class"></div>');
      add(
        'bg-inner-img-broken',
        '<div class="bg" style="background-image:url(/img/ok.png)"><img src="/img/missing.png?inner"></div>',
      );
      add('bg-pseudo-only', '<div class="bg pseudo"></div>');

      add(
        'dom',
        `
  <div id="present">x</div>
  <div id="hidden" style="display:none">x</div>
  <div id="text">Pro</div>
  <div id="spaces">
     </div>
  <div id="nbsp">&nbsp;</div>
  <div id="comment"><!-- --></div>
  <div id="style-only"><style>.a{color:red}</style></div>
  <div id="script-only"><script type="application/json">{"a":1}<\/script></div>
  <div id="zwsp">&#8203;</div>
  <div id="hidden-text"><span style="display:none">secret</span></div>
  <div id="img-only"><img src="/img/ok.png?inner-value"></div>
  <input id="input-value" value="typed">
  <button id="btn-ok">ok</button>
  <button id="btn-disabled" disabled>x</button>
  <button id="btn-class" class="disabled">x</button>
  <fieldset disabled><button id="btn-fieldset">x</button></fieldset>
  <button id="btn-aria" aria-disabled="true">x</button>
  <input id="submit-disabled" type="submit" disabled>
  <a id="link-disabled" class="btn disabled" href="#">x</a>
  <ul id="list"><li></li><li></li><li></li></ul>
  <div id="t-self-hidden" style="display:none">Pro</div>
  <div id="t-hidden-attr" hidden>Pro</div>
  <details><summary>s</summary><div id="t-details-closed">Pro</div></details>
  <div id="t-visibility-hidden" style="visibility:hidden">Pro</div>
  <div id="t-display-contents" style="display:contents">Pro</div>
  <div id="t-opacity" style="opacity:0">Pro</div>
  <div id="t-sr-only"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading…</span></div>
  <div id="t-offscreen" style="position:absolute;left:-9999px">Pro</div>
  <div class="t-dup-hidden-filled" style="display:none">Pro</div><div class="t-dup-hidden-filled"></div>
  <div class="t-dup-hidden-empty" style="display:none"></div><div class="t-dup-hidden-empty">Pro</div>
  <button id="b-hidden" style="display:none">x</button>
  <div inert><button id="b-inert">x</button></div>
  <button id="b-visibility" style="visibility:hidden">x</button>
  <button id="b-pointer-none" style="pointer-events:none">x</button>
  <fieldset disabled><legend><button id="b-legend">x</button></legend></fieldset>
  <button class="b-dup" disabled style="display:none">x</button><button class="b-dup">x</button>
`,
      );

      const check = (group, id, actual, expected, note = '') =>
        cases.push({ group, id, expected, actual, ok: actual === expected, note });

      const sel = (id) => `#${id} > *`;
      const early = imageCases.map(([id]) => [id, H.checkImagesIsDisplayed(sel(id))]);

      window.addEventListener('load', async () => {
        add('img-srcset-fresh', '<img srcset="/img/slow.png?fresh 1x">');
        const freshSrcset = H.asyncCheckImagesIsDisplayed(sel('img-srcset-fresh'), 5000);
        await new Promise((done) => setTimeout(done, 3000));
        document.querySelector(sel('img-swap-to-broken')).src = '/img/missing.png?swapped';
        document.querySelector(sel('img-swap-to-slow')).src = '/img/slow.png?swapped';
        const dynamic = [
          freshSrcset.then((actual) =>
            check(
              'asyncCheckImagesIsDisplayed',
              'img-srcset-fresh',
              actual,
              true,
              'вызов сразу после вставки',
            ),
          ),
        ];
        await new Promise((done) => setTimeout(done, 0));

        for (const [id, , syncExpected, asyncExpected, note] of imageCases) {
          check(
            'checkImagesIsDisplayed',
            id,
            H.checkImagesIsDisplayed(sel(id)),
            syncExpected,
            note,
          );
        }
        check(
          'checkImagesIsDisplayed@DOMready',
          'img-slow',
          early.find(([id]) => id === 'img-slow')[1],
          false,
        );

        const asyncImages = imageCases.map(async ([id, , , expected, note]) =>
          check(
            'asyncCheckImagesIsDisplayed',
            id,
            await H.asyncCheckImagesIsDisplayed(sel(id), 5000),
            expected,
            note,
          ),
        );
        const asyncBackgrounds = [
          ...backgroundCases,
          ['bg-from-class', '', true],
          ['bg-inner-img-broken', '', false, 'README: <img> внутри важнее фона'],
          ['bg-pseudo-only', '', false, 'README: ::before не учитывается'],
        ].map(async ([id, , expected, note]) =>
          check(
            'asyncCheckBackgroundImagesIsDisplayed',
            id,
            await H.asyncCheckBackgroundImagesIsDisplayed(sel(id), 5000),
            expected,
            note,
          ),
        );

        const loads = [
          ['ok', '/img/ok.png?load', true],
          ['404', '/img/missing.png?load', false],
          ['corrupt', '/img/corrupt.png?load', false],
          ['svg-bare', '/img/bare.svg?load', true],
          ['svg-404', '/img/missing.svg?load', false],
          ['svg-without-extension', '/img/svg-without-extension?load', true],
          ['slow', '/img/slow.png?load', true],
        ].map(async ([id, src, expected]) =>
          check('loadImage', id, await H.loadImage(src, 5000), expected),
        );

        const bgUrl = (id) => H.extractBackgroundUrl(document.querySelector(sel(id)));
        check('extractBackgroundUrl', 'bg-ok', bgUrl('bg-ok'), `${location.origin}/img/ok.png`);
        check(
          'extractBackgroundUrl',
          'bg-parens-in-url',
          bgUrl('bg-parens-in-url'),
          `${location.origin}/img/ok.png?a=(1)`,
        );
        check(
          'extractBackgroundUrl',
          'bg-quote-in-url',
          bgUrl('bg-quote-in-url'),
          `${location.origin}/img/ok.png?q=%27x%27`,
        );
        check(
          'extractBackgroundUrl',
          'bg-image-set-string',
          bgUrl('bg-image-set-string'),
          `${location.origin}/img/ok.png`,
        );
        check('extractBackgroundUrl', 'bg-gradient-only', bgUrl('bg-gradient-only'), null);

        check('checkRender', 'present', H.checkRender('#present'), true);
        check(
          'checkRender',
          'display-none',
          H.checkRender('#hidden'),
          true,
          'README: «есть в DOM»',
        );
        check('checkRender', 'missing', H.checkRender('#nope'), false);
        check('checkRender', 'array-one-missing', H.checkRender(['#present', '#nope']), false);
        check('checkRender', 'invalid-selector', H.checkRender('#a b[c'), false);

        const inner = (id) => H.checkRenderInnerValue(`#${id}`);
        check('checkRenderInnerValue', 'text', inner('text'), true);
        check('checkRenderInnerValue', 'spaces', inner('spaces'), false);
        check('checkRenderInnerValue', 'nbsp', inner('nbsp'), false);
        check('checkRenderInnerValue', 'comment', inner('comment'), false);
        check(
          'checkRenderInnerValue',
          'style-only',
          inner('style-only'),
          false,
          'стиль — не текст',
        );
        check(
          'checkRenderInnerValue',
          'script-only',
          inner('script-only'),
          false,
          'данные скрипта — не текст',
        );
        check(
          'checkRenderInnerValue',
          'zero-width-space',
          inner('zwsp'),
          false,
          'невидимый символ',
        );
        check(
          'checkRenderInnerValue',
          'hidden-text',
          inner('hidden-text'),
          false,
          'текст скрыт display:none',
        );
        check('checkRenderInnerValue', 'img-only', inner('img-only'), false, 'README: нужен текст');
        check(
          'checkRenderInnerValue',
          'input-value',
          inner('input-value'),
          false,
          'README: нужен текст',
        );

        const button = (id) => H.checkEnabledButtonState(`#${id}`);
        check('checkEnabledButtonState', 'enabled', button('btn-ok'), true);
        check('checkEnabledButtonState', 'disabled-attr', button('btn-disabled'), false);
        check('checkEnabledButtonState', 'disabled-class', button('btn-class'), false);
        check(
          'checkEnabledButtonState',
          'disabled-fieldset',
          button('btn-fieldset'),
          false,
          'кнопку нельзя нажать',
        );
        check(
          'checkEnabledButtonState',
          'aria-disabled',
          button('btn-aria'),
          false,
          'кнопка объявлена недоступной',
        );
        check('checkEnabledButtonState', 'submit-input-disabled', button('submit-disabled'), false);
        check('checkEnabledButtonState', 'link-disabled-class', button('link-disabled'), false);
        check('checkEnabledButtonState', 'missing', button('nope'), false);

        check('getAmount', 'three', H.getAmount('#list li'), 3);
        check('getAmount', 'invalid', H.getAmount('#list li['), 0);
        check('checkAmount', 'exact', H.checkAmount('#list li', 3), true);
        check('checkAmount', 'not-exact', H.checkAmount('#list li', 2), false);
        check('checkGTEAmount', 'enough', H.checkGTEAmount('#list li', 3), true);
        check('checkGTEAmount', 'not-enough', H.checkGTEAmount('#list li', 4), false);

        const shows = (selector) => H.checkRenderInnerValue(selector);
        check('checkRenderInnerValue', 'self-hidden', shows('#t-self-hidden'), false);
        check('checkRenderInnerValue', 'hidden-attribute', shows('#t-hidden-attr'), false);
        check('checkRenderInnerValue', 'details-closed', shows('#t-details-closed'), false);
        check('checkRenderInnerValue', 'visibility-hidden', shows('#t-visibility-hidden'), false);
        check('checkRenderInnerValue', 'display-contents', shows('#t-display-contents'), true);
        check(
          'checkRenderInnerValue',
          'opacity-0',
          shows('#t-opacity'),
          true,
          'README: визуально спрятанный текст засчитывается',
        );
        check(
          'checkRenderInnerValue',
          'sr-only',
          shows('#t-sr-only'),
          true,
          'README: визуально спрятанный текст засчитывается',
        );
        check(
          'checkRenderInnerValue',
          'offscreen',
          shows('#t-offscreen'),
          true,
          'README: визуально спрятанный текст засчитывается',
        );
        check(
          'checkRenderInnerValue',
          'duplicates-hidden-filled',
          shows('.t-dup-hidden-filled'),
          false,
        );
        check(
          'checkRenderInnerValue',
          'duplicates-hidden-empty',
          shows('.t-dup-hidden-empty'),
          true,
        );

        const pressable = (selector) => H.checkEnabledButtonState(selector);
        check('checkEnabledButtonState', 'display-none', pressable('#b-hidden'), false);
        check('checkEnabledButtonState', 'inert', pressable('#b-inert'), false);
        check('checkEnabledButtonState', 'visibility-hidden', pressable('#b-visibility'), false);
        check(
          'checkEnabledButtonState',
          'pointer-events-none',
          pressable('#b-pointer-none'),
          false,
        );
        check(
          'checkEnabledButtonState',
          'legend-of-disabled-fieldset',
          pressable('#b-legend'),
          true,
        );
        check('checkEnabledButtonState', 'duplicates-hidden-disabled', pressable('.b-dup'), true);

        await Promise.all([...asyncImages, ...asyncBackgrounds, ...loads, ...dynamic]);

        window.helperResults = cases;
      });
    </script>
  </body>
</html>
