version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # ts-jest поддерживает только TypeScript <7
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Новый major Faro — осознанный релиз обёртки с новым диапазоном peerDependencies
      - dependency-name: '@grafana/*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
