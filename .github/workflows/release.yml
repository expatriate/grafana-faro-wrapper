name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --ignore-scripts

      - name: Check tag matches package.json version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build:all
      - run: npm run verify:package

      - name: Publish to npm
        run: |
          NAME=$(node -p 'require("./package.json").name')
          VERSION=${TAG#v}
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm, skipping publish"
          elif [[ "$VERSION" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          elif [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" --verify-tag --generate-notes --prerelease
          else
            gh release create "$TAG" --verify-tag --generate-notes
          fi
